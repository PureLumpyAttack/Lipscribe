<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="When noise drowns your words, or your voice is gone, Lipscribe reads your lips and says it for you." />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ff5b3a" />
    <title>Lipscribe</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Geist:wght@400;500;600&display=swap"
    />
    <link rel="stylesheet" href="/css/story.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js" defer></script>
    <script type="module" src="/js/story.js"></script>
  </head>
  <body>
    <!-- Shared drawings -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="profile" viewBox="0 0 600 640">
        <path
          d="M236 640C232 590 224 524 216 478 210 452 198 430 184 408 156 364 150 280 176 214 204 146 262 114 330 114 404 116 448 162 456 222 460 248 460 262 464 276 466 286 460 294 462 304L496 362C504 374 500 384 488 386 480 387 472 388 466 390 470 398 474 404 472 410 470 414 466 416 462 418 468 422 472 430 466 438 460 444 456 446 456 452 458 462 466 472 460 482 452 496 428 500 404 504 388 507 376 512 372 526 370 566 374 604 380 640Z"
        />
        <path d="M40 640C70 588 150 562 222 556L392 554C466 560 530 594 560 640Z" />
      </symbol>
      <symbol id="quotes" viewBox="0 0 32 32">
        <path class="q1" fill="#17161c" d="M3 7.5A1.5 1.5 0 0 1 4.5 6h8A1.5 1.5 0 0 1 14 7.5V16c0 5.2-2.9 8.6-8 10l-1.3-2.6c2.7-1 4.2-2.8 4.5-5.4H4.5A1.5 1.5 0 0 1 3 16.5Z" />
        <path class="q2" fill="#c2392e" d="M18 7.5A1.5 1.5 0 0 1 19.5 6h8A1.5 1.5 0 0 1 29 7.5V16c0 5.2-2.9 8.6-8 10l-1.3-2.6c2.7-1 4.2-2.8 4.5-5.4h-4.7A1.5 1.5 0 0 1 18 16.5Z" />
      </symbol>
    </svg>

    <main>
      <h1 class="visually-hidden">Lipscribe: say it without sound</h1>

      <!-- Act 1: noise -->
      <section class="act act-noise" id="noise" aria-label="Noise drowns out a phone call">
        <div class="stage n-stage">
          <svg class="layer n-skyline" viewBox="0 0 1600 500" preserveAspectRatio="xMidYMax slice" aria-hidden="true"></svg>
          <svg class="layer n-crowd-back" viewBox="0 0 2400 300" preserveAspectRatio="xMinYMax slice" aria-hidden="true"></svg>

          <div class="n-figure">
            <svg class="n-figure-art in" viewBox="0 0 1100 640" aria-hidden="true">
              <use href="#profile" width="600" height="640" fill="#17161c" />
              <!-- What the webcam sees: a soft cone from the laptop to the face -->
              <path class="n-cone" d="M900 306 476 350V476Z" fill="#ffd447" opacity="0.2" />
              <!-- Upper arm, mostly hidden behind the desk -->
              <path d="M300 610C334 572 380 544 420 524" fill="none" stroke="#2c2a33" stroke-width="54" stroke-linecap="round" />
              <!-- Desk -->
              <rect x="350" y="516" width="790" height="18" rx="4" fill="#8f2814" />
              <rect x="368" y="534" width="772" height="120" fill="#74200f" />
              <!-- Laptop: keyboard base, then the lid with its screen facing the person -->
              <path d="M598 516 612 500H880L868 516Z" fill="#f4f3ef" />
              <path d="M598 516H868V521H598Z" fill="#d9d5cc" />
              <path d="M852 512 896 290C897 286 900 284 904 285L956 296C960 297 962 301 961 305L914 512Z" fill="#f4f3ef" />
              <path d="M852 512 896 290" stroke="#ffd447" stroke-width="5" stroke-linecap="round" />
              <circle cx="899" cy="304" r="5" fill="#17161c" />
              <!-- Forearm resting on the desk, hand on the keyboard -->
              <path d="M420 494H578" fill="none" stroke="#2c2a33" stroke-width="44" stroke-linecap="round" />
              <path d="M572 474c22-6 52-4 76 6 14 6 24 12 26 18 1 4-2 6-8 6h-70c-14 0-26-6-28-16-1-6 0-12 4-14Z" fill="#2c2a33" />
              <path d="M600 496c10 1 20 4 26 9" fill="none" stroke="#17161c" stroke-width="3" stroke-linecap="round" opacity="0.6" />
            </svg>
            <div class="n-bubble-pos">
              <div class="n-bubble-pop in">
                <p class="bubble n-bubble">Can you hear me?</p>
              </div>
            </div>
          </div>

          <svg class="layer n-noise" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"></svg>
          <svg class="layer n-crowd-front" viewBox="0 0 2800 300" preserveAspectRatio="xMinYMax slice" aria-hidden="true"></svg>

          <div class="n-chrome">
            <span class="wordmark in"><svg aria-hidden="true"><use href="#quotes" /></svg>lipscribe</span>
            <a class="skip in" href="/demo">Skip to the demo</a>
          </div>
          <div class="n-fade"></div>
        </div>
      </section>

      <!-- Act 2: silence -->
      <section class="act act-silence" id="silence" aria-label="Some people cannot use their voice">
        <svg class="s-line" data-speed="0.55" viewBox="0 0 1600 120" preserveAspectRatio="none" aria-hidden="true">
          <path pathLength="1" d="M0 60H700l18-34 22 68 18-34H1600" />
        </svg>
        <div class="s-figure" data-speed="0.8">
          <svg viewBox="0 0 600 640" aria-hidden="true">
            <g transform="translate(600 0) scale(-1 1)">
              <use href="#profile" fill="#26324d" />
              <path d="M226 532C276 550 334 552 380 534 386 548 388 564 386 580 338 600 276 598 230 580 226 564 224 548 226 532Z" fill="#c2392e" />
            </g>
          </svg>
          <svg class="s-bubble" data-speed="1.2" viewBox="0 0 200 140" aria-hidden="true">
            <path
              pathLength="1"
              d="M24 10h132a16 16 0 0 1 16 16v60a16 16 0 0 1-16 16h-8l18 26-40-26H24a16 16 0 0 1-16-16V26a16 16 0 0 1 16-16Z"
            />
          </svg>
        </div>
        <h2 class="s-text">Some voices make no sound</h2>
      </section>

      <!-- Act 3: focus (the turn) -->
      <section class="act act-focus" id="focus" aria-label="Lipscribe reads lips and turns them into words">
        <div class="stage f-stage">
          <div class="layer f-ink" aria-hidden="true"></div>
          <svg class="layer f-noise" viewBox="0 0 1600 900" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div class="f-col">
            <div class="f-lens">
              <svg viewBox="0 0 960 540" aria-hidden="true">
                <defs>
                  <clipPath id="teeth-clip"><path id="m-clip" d="" /></clipPath>
                </defs>
                <rect width="960" height="540" fill="#e3b195" />
                <g id="mouth">
                  <path id="m-inner" fill="#3b1917" d="" />
                  <g clip-path="url(#teeth-clip)"><ellipse id="m-teeth" cx="480" cy="278" rx="118" ry="4" fill="#f1e7df" /></g>
                  <path id="m-upper" fill="#a8483f" d="" />
                  <path id="m-lower" fill="#c25f55" d="" />
                </g>
                <path
                  class="f-brackets"
                  d="M236 196v-56h56M724 196v-56h-56M236 380v56h56M724 380v56h-56"
                  fill="none"
                  stroke="#17161c"
                  stroke-width="12"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </div>
            <div class="f-caption">
              <p class="f-text" aria-hidden="true"></p>
              <span class="f-line"></span>
            </div>
            <p class="visually-hidden">Lipscribe hears: Can you hear me now?</p>
            <h2 class="f-claim">Lipscribe reads lips</h2>
          </div>
          <div class="f-wipe"></div>
        </div>
      </section>

      <!-- Act 4: how -->
      <section class="act act-how" id="how" aria-label="How it works">
        <div class="stage h-stage">
          <div class="h-rail">
            <article class="h-panel">
              <div class="h-art h-art--fog">
                <svg viewBox="0 0 520 400" aria-hidden="true">
                  <rect x="80" y="40" width="360" height="236" rx="18" fill="#f4f3ef" stroke="#17161c" stroke-width="10" />
                  <circle cx="260" cy="64" r="8" fill="#c2392e" />
                  <use href="#profile" x="186" y="86" width="150" height="160" fill="#17161c" />
                  <path d="M36 300h448l-26 42H62Z" fill="#17161c" />
                </svg>
              </div>
              <h3 class="h-word">Watch.</h3>
            </article>
            <article class="h-panel">
              <div class="h-art h-art--butter">
                <svg viewBox="200 110 560 360" aria-hidden="true">
                  <path id="r-inner" fill="#3b1917" d="" />
                  <path id="r-upper" fill="#9b4c45" d="" />
                  <path id="r-lower" fill="#b4605a" d="" />
                  <path d="M250 190v-50h50M710 190v-50h-50M250 380v50h50M710 380v50h-50" fill="none" stroke="#17161c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
                </svg>
              </div>
              <h3 class="h-word">Read.</h3>
            </article>
            <article class="h-panel">
              <div class="h-art h-art--vermilion">
                <svg viewBox="0 0 520 400" aria-hidden="true">
                  <path d="M70 80h260a30 30 0 0 1 30 30v120a30 30 0 0 1-30 30H200l-62 52 12-52H70a30 30 0 0 1-30-30V110a30 30 0 0 1 30-30Z" fill="#f4f3ef" />
                  <rect x="82" y="124" width="216" height="18" rx="9" fill="#17161c" />
                  <rect x="82" y="162" width="168" height="18" rx="9" fill="#17161c" />
                  <rect x="82" y="200" width="192" height="18" rx="9" fill="#17161c" />
                  <g class="h-waves" fill="none" stroke="#17161c" stroke-width="12" stroke-linecap="round">
                    <path d="M398 136a62 62 0 0 1 0 88" />
                    <path d="M428 108a104 104 0 0 1 0 144" />
                    <path d="M458 80a146 146 0 0 1 0 200" />
                  </g>
                </svg>
              </div>
              <h3 class="h-word">Speak.</h3>
            </article>
          </div>
        </div>
      </section>

      <!-- Act 5: close -->
      <section class="act act-close" id="start" aria-label="Try Lipscribe">
        <div class="c-inner">
          <svg class="c-mark" viewBox="0 0 32 32" aria-hidden="true">
            <path class="q1" fill="#17161c" d="M3 7.5A1.5 1.5 0 0 1 4.5 6h8A1.5 1.5 0 0 1 14 7.5V16c0 5.2-2.9 8.6-8 10l-1.3-2.6c2.7-1 4.2-2.8 4.5-5.4H4.5A1.5 1.5 0 0 1 3 16.5Z" />
            <path class="q2" fill="#c2392e" d="M18 7.5A1.5 1.5 0 0 1 19.5 6h8A1.5 1.5 0 0 1 29 7.5V16c0 5.2-2.9 8.6-8 10l-1.3-2.6c2.7-1 4.2-2.8 4.5-5.4h-4.7A1.5 1.5 0 0 1 18 16.5Z" />
          </svg>
          <h2 class="c-title">Say it without sound</h2>
          <div class="c-actions">
            <a class="c-btn c-btn--dark" href="/demo" data-magnet>
              Try the live demo
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h10M9 4l4 4-4 4" /></svg>
            </a>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
